name: Release (Rust)

on:
  workflow_dispatch:
  push:
    tags:
      - 'rust-v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test
        run: cargo test --workspace --all-targets --locked

      - name: Build
        run: cargo build -p wildssim --release --locked

      - name: Zip
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: Compress-Archive -Path target/release/wildssim.exe -DestinationPath "WildsSimRust-${{ github.ref_name }}.zip"

      - name: Create prerelease
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          make_latest: false
          name: ${{ github.ref_name }}
          body: Unofficial, experimental AI-assisted Rust port. See README.md.
          files: WildsSimRust-${{ github.ref_name }}.zip
