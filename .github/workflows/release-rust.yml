name: Release (Rust port)

on:
  push:
    tags:
      - 'rust-v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: WildsSimRust

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test
        run: cargo test --workspace --all-targets --locked

      - name: Build
        run: cargo build -p wildssim --release --locked

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path target/release/wildssim.exe -DestinationPath "WildsSimRust-${{ github.ref_name }}.zip"

      - name: Create prerelease
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          make_latest: false
          name: ${{ github.ref_name }}
          body: Unofficial, experimental AI-assisted Rust port. See WildsSimRust/README.md.
          files: WildsSimRust/WildsSimRust-${{ github.ref_name }}.zip
